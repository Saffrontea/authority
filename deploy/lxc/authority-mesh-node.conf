# Base configuration shared by the two WireGuard PoC nodes.
lxc.arch = linux64

# Keep the mesh proof small enough to coexist with Rust compilation and the DB.
lxc.cgroup2.memory.max = 268435456
lxc.cgroup2.memory.swap.max = 268435456
lxc.cgroup2.cpu.max = 100000 100000

# This bridge is only the underlay. Application traffic uses wg0.
lxc.net.0.type = veth
lxc.net.0.link = lxcbr0
lxc.net.0.flags = up
lxc.net.0.name = eth0

lxc.apparmor.profile = generated
lxc.apparmor.allow_nesting = 0
