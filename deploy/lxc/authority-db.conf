# Base configuration for a root-managed PostgreSQL development container.
lxc.arch = linux64
lxc.uts.name = authority-db

# Keep the PoC database from competing with Rust compilation.
lxc.cgroup2.memory.max = 536870912
lxc.cgroup2.memory.swap.max = 536870912
lxc.cgroup2.cpu.max = 200000 100000

# PostgreSQL is reachable only through the host-local LXC bridge. Do not
# attach this container directly to a public interface.
lxc.net.0.type = veth
lxc.net.0.link = lxcbr0
lxc.net.0.flags = up
lxc.net.0.name = eth0

lxc.apparmor.profile = generated
lxc.apparmor.allow_nesting = 0
